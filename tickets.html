<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiket Saya - TiketKonserku</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style_newbie.css">
</head>
<body>

<div id="toast" class="toast"></div>

<header class="topbar">
  <a href="index.html" class="logo">🎫 TiketKonserku</a>
  <nav>
    <a href="index.html#home">Home</a>
    <a href="index.html#explore">Explore</a>
    <a href="tickets.html" class="aktif">Tiket Saya</a>
  </nav>
  <button id="loginBtn">Login</button>
  <span id="profileBox" class="hidden">
    Halo, <b id="profileName">Rizal</b>
    <button id="logoutBtn">Keluar</button>
  </span>
</header>

<section id="tickets" class="tickets-page">
  <div class="tickets-hero">
    <h1>Tiket Saya</h1>
    <p>Semua tiket yang sudah kamu pesan, lengkap dengan QR buat masuk venue.</p>
  </div>

  <div id="ticketList"></div>
  <p id="ticketEmpty">Kamu belum punya tiket. Yuk pesan event dulu!</p>
</section>

<footer>
  <p>TiketKonserku - Tugas Kuliah (Demo, tanpa backend)</p>
</footer>

<div id="loginModal" class="modal hidden">
  <div class="modal-box">
    <button class="close-btn" onclick="closeModal('loginModal')">X</button>
    <h2>Login</h2>
    <p>Akun demo, data tidak dikirim ke server.</p>
    <form id="loginForm">
      <label>Nama</label>
      <input id="loginName" value="Rizal" required>

      <label>Email</label>
      <input id="loginEmail" type="email" value="rizal@example.com" required>

      <label>Password</label>
      <input id="loginPassword" type="password" value="12345678" required>

      <button type="submit">Masuk</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
